<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="FoG"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>FoG</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100dvh;background:#08090b;color:#f5f6f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;justify-content:center;align-items:flex-start;overflow:hidden}.area{position:relative;margin-top:max(56px,env(safe-area-inset-top) + 32px);width:min(330px,calc(100vw - 32px));display:flex;flex-direction:column;align-items:center}.pill{border:1px solid #ffffff1f;background:linear-gradient(135deg,#25282d,#15171b);height:46px;width:188px;border-radius:99px;box-shadow:0 10px 35px #0007,0 1px 0 #ffffff12 inset;display:flex;align-items:center;gap:12px;padding:0 11px 0 18px;cursor:pointer;transition:width .3s,transform .3s;user-select:none;color:inherit}.pill:hover,.pill:focus-visible{width:218px;transform:translateY(1px)}.logo{font-size:17px;font-weight:300;letter-spacing:3px;flex:1;text-align:left}.settings-icon{height:30px;width:34px;display:grid;place-items:center;border-radius:25px;background:#ffffff0b}.settings-icon svg{width:19px;height:19px}.panel{width:100%;background:#16181cf7;border:1px solid #ffffff17;border-radius:24px;margin-top:11px;padding:19px;box-shadow:0 20px 55px #000a;opacity:0;transform:translateY(-9px) scale(.96);pointer-events:none;visibility:hidden;transition:opacity .2s,transform .25s,visibility .25s}.open .panel{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;visibility:visible}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:19px}.panel-head b{font-size:14px;font-weight:550}.close{background:#ffffff0d;color:#dedfe3;border:0;border-radius:50%;height:26px;width:26px;font-size:20px;cursor:pointer}.setting{display:flex;align-items:center;gap:14px;margin:18px 0}.setting svg{width:18px;height:18px;color:#aeb3bc;flex:none}.setting-body{flex:1}.setting-title{display:flex;justify-content:space-between;font-size:12px;color:#d7d9df;margin-bottom:9px}.setting-title span:last-child{color:#9ea4ae;font-variant-numeric:tabular-nums}input[type=range]{appearance:none;-webkit-appearance:none;display:block;width:100%;height:5px;background:linear-gradient(90deg,#dfe3eb var(--progress),#373b43 var(--progress));border-radius:5px;outline:none;margin:0}input[type=range]::-webkit-slider-thumb{appearance:none;width:15px;height:15px;border-radius:50%;background:white;cursor:pointer}.note{border-top:1px solid #ffffff12;margin-top:20px;padding-top:13px;font-size:10.5px;line-height:1.55;color:#878b94}.hint{position:absolute;top:calc(100% + 10px);font-size:11px;color:#565b64;white-space:nowrap}.open .hint{opacity:0}button:focus-visible,input:focus-visible{outline:2px solid #aab6ca;outline-offset:3px}
.launch{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:24px;background:#08090b;transition:opacity .4s ease,visibility .4s ease;z-index:2}.launch-name{font-size:25px;letter-spacing:9px;font-weight:200;margin-left:9px}.start-btn{border:1px solid #ffffff24;border-radius:99px;background:linear-gradient(135deg,#30343b,#1d2026);color:#fff;font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1px;padding:13px 38px;cursor:pointer;box-shadow:0 10px 28px #0007}.start-btn:active{transform:scale(.97)}body.started .launch{opacity:0;visibility:hidden;pointer-events:none}body:not(.started) .area{opacity:0;visibility:hidden;pointer-events:none}body.started .area{animation:appear .4s ease both}@keyframes appear{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
</style></head><body><div class="launch" id="launch"><div class="launch-name">FoG</div><button class="start-btn" id="start">Начать</button></div><main class="area" id="area"><button class="pill" id="pill" aria-label="Открыть настройки" aria-expanded="false"><span class="logo">FoG</span><span class="settings-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.6"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2.6" fill="#272a30"/><circle cx="16" cy="17" r="2.6" fill="#272a30"/></svg></span></button><section class="panel" aria-label="Настройки"><div class="panel-head"><b>Настройки FoG</b><button id="close" class="close" aria-label="Закрыть">×</button></div>
<div class="setting"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9H4zM17 9a5 5 0 0 1 0 6M20 6a9 9 0 0 1 0 12"/></svg><div class="setting-body"><label class="setting-title" for="vol"><span>Громкость</span><span id="volLabel">50%</span></label><input id="vol" type="range" min="0" max="100" value="50"></div></div><div class="setting"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg><div class="setting-body"><label class="setting-title" for="bright"><span>Яркость оформления</span><span id="brightLabel">30%</span></label><input id="bright" type="range" min="0" max="100" value="30"></div></div><div class="note">Ползунки изменяют только настройки приложения, а не системную громкость или яркость устройства.</div></section><div class="hint">Нажми на плашку, чтобы открыть</div></main>
<script>document.getElementById('start').addEventListener('click',()=>document.body.classList.add('started'));const area=document.getElementById('area'),pill=document.getElementById('pill');function toggle(v){area.classList.toggle('open',v);pill.setAttribute('aria-expanded',String(v))}pill.addEventListener('click',()=>toggle(!area.classList.contains('open')));document.getElementById('close').addEventListener('click',()=>toggle(false));document.addEventListener('keydown',e=>{if(e.key==='Escape')toggle(false)});for(const id of ['vol','bright']){const el=document.getElementById(id),label=document.getElementById(id+'Label');try{let saved=localStorage.getItem('fog-'+id);if(saved!==null)el.value=saved}catch(e){}function update(){label.textContent=el.value+'%';el.style.setProperty('--progress',el.value+'%');try{localStorage.setItem('fog-'+id,el.value)}catch(e){}if(id==='bright'){let v=Number(el.value);document.body.style.background='rgb('+Math.round(3+v*.18)+','+Math.round(4+v*.18)+','+Math.round(6+v*.18)+')'}}el.addEventListener('input',update);update()}if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
